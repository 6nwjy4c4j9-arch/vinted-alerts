name: Vinted alerts

on:
  schedule:
    - cron: "0 */6 * * *"      # filet de sécurité : relance toutes les 6 h
  workflow_dispatch:           # lancement manuel + auto-relance en fin de cycle

concurrency:
  group: vinted-alerts
  cancel-in-progress: true     # jamais deux jobs en parallèle

permissions:
  contents: write              # autorise le commit de l'état
  actions: write               # autorise l'auto-relance

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # plafond GitHub : 360 min/job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation
        run: pip install requests

      - name: Surveillance continue — un scan toutes les ~2 min pendant 5 h 45
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "vinted-bot"
          git config user.email "bot@users.noreply.github.com"

          END=$(( $(date +%s) + 345 * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            echo "=== Scan $i — $(date -u '+%H:%M:%S') ==="
            python vinted_alert.py --once || echo "[!] scan en échec, on continue"

            # État commité toutes les 10 scans (~20 min)
            if [ $((i % 10)) -eq 0 ]; then
              git add vinted_seen_items.json
              if ! git diff --cached --quiet; then
                git commit -m "state: scan $i" || true
                git push || echo "[!] push ignoré"
              fi
            fi

            sleep 90            # 90 s + ~30 s de scan ≈ un scan toutes les 2 min
          done

          git add vinted_seen_items.json
          if ! git diff --cached --quiet; then
            git commit -m "state: final" || true
            git push || echo "[!] push ignoré"
          fi

      - name: Auto-relance du cycle suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Vinted alerts" --repo "${{ github.repository }}"
